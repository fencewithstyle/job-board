<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Grain Innovation Job Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  html{color-scheme:light dark}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
  :root{
    --paper:#F1F3F2;
    --surface:#FFFFFF;
    --surface-2:#E7EBE9;
    --line:#CFD6D3;
    --line-soft:#DFE4E2;
    --ink:#161C1A;
    --ink-2:#454F4C;
    --ink-3:#6B7772;
    --accent:#1D5C63;
    --accent-soft:#DCEAEA;
    --s-new:#5C6B75;
    --s-permit:#A9660A;
    --s-approved:#3A5FA8;
    --s-sched:#2F6E8F;
    --s-active:#8A4B12;
    --s-done:#3C7A4B;
    --s-new-bg:#E6EAEC;
    --s-permit-bg:#FAEEDA;
    --s-approved-bg:#E3EAF7;
    --s-sched-bg:#E1EDF3;
    --s-active-bg:#F8E9DA;
    --s-done-bg:#E2F0E6;
    --shadow:0 1px 2px rgba(22,28,26,.06),0 8px 24px rgba(22,28,26,.07);
    --radius:6px;
    --on-accent:#FFFFFF;
    --display:"Saira Condensed","Arial Narrow",Helvetica,sans-serif;
    --body:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141918;
      --surface:#1B2120;
      --surface-2:#232A29;
      --line:#333C3A;
      --line-soft:#2A3231;
      --ink:#E8EDEB;
      --ink-2:#B3BDBA;
      --ink-3:#8A9591;
      --accent:#5FB2AF;
      --accent-soft:#1F3634;
      --s-new:#9AA8AF;
      --s-permit:#E0A752;
      --s-approved:#8FADE0;
      --s-sched:#7FB4CE;
      --s-active:#D79A5E;
      --s-done:#7DBE90;
      --s-new-bg:#242C2E;
      --s-permit-bg:#33280F;
      --s-approved-bg:#1F2839;
      --s-sched-bg:#1C2A31;
      --s-active-bg:#32250F;
      --s-done-bg:#1C2E22;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
      --on-accent:#0F1716;
    }
  }
  :root[data-theme="dark"]{
    --paper:#141918;
    --surface:#1B2120;
    --surface-2:#232A29;
    --line:#333C3A;
    --line-soft:#2A3231;
    --ink:#E8EDEB;
    --ink-2:#B3BDBA;
    --ink-3:#8A9591;
    --accent:#5FB2AF;
    --accent-soft:#1F3634;
    --s-new:#9AA8AF;
    --s-permit:#E0A752;
    --s-approved:#8FADE0;
    --s-sched:#7FB4CE;
    --s-active:#D79A5E;
    --s-done:#7DBE90;
    --s-new-bg:#242C2E;
    --s-permit-bg:#33280F;
    --s-approved-bg:#1F2839;
    --s-sched-bg:#1C2A31;
    --s-active-bg:#32250F;
    --s-done-bg:#1C2E22;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    --on-accent:#0F1716;
  }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--body);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---------- header ---------- */
  header.top{
    border-bottom:1px solid var(--line);background:var(--surface);
    position:sticky;top:0;z-index:20;
  }
  .top-inner{
    max-width:1180px;margin:0 auto;padding:16px 22px 14px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  }
  .brandline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{
    font-family:var(--display);font-weight:700;font-size:30px;line-height:1;
    margin:0;letter-spacing:-.01em;text-wrap:balance;
  }
  .brandsub{
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);
  }
  .top-right{display:flex;align-items:center;gap:14px}
  .conn{
    display:inline-flex;align-items:center;gap:7px;
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--s-done);flex:none}
  .dot.off{background:var(--s-permit)}

  /* ---------- pipeline rail ---------- */
  .rail-wrap{border-bottom:1px solid var(--line);background:var(--surface)}
  .rail{
    max-width:1180px;margin:0 auto;padding:0 22px 16px;
    display:flex;gap:8px;overflow-x:auto;
  }
  .stagebtn{
    flex:1 1 0;min-width:132px;text-align:left;cursor:pointer;
    background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
    border-left:3px solid var(--sc,var(--line));
    padding:9px 11px 10px;transition:background .12s,border-color .12s;
  }
  .stagebtn:hover{background:var(--surface-2)}
  .stagebtn[aria-pressed="true"]{background:var(--surface-2);border-color:var(--ink-3)}
  .stagebtn .sname{
    display:block;font-family:var(--display);font-weight:600;font-size:14px;
    letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);
  }
  .stagebtn .scount{
    display:block;font-family:var(--mono);font-weight:600;font-size:24px;line-height:1.15;
    font-variant-numeric:tabular-nums;color:var(--sc,var(--ink));
  }

  /* ---------- toolbar ---------- */
  main{max-width:1180px;margin:0 auto;padding:18px 22px 60px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .search{
    flex:1 1 240px;min-width:200px;padding:8px 11px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  }
  .search::placeholder{color:var(--ink-3)}
  .btn{
    cursor:pointer;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--surface);padding:8px 13px;font-weight:600;
    transition:background .12s;
  }
  .btn:hover{background:var(--surface-2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.primary{color:var(--on-accent)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-3);font-weight:400}
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
  .btn.danger{color:var(--s-permit);border-color:var(--line)}

  /* ---------- job list ---------- */
  .listhead,.job{
    display:grid;
    grid-template-columns:minmax(190px,2.1fr) minmax(120px,1.1fr) 92px 150px 118px 44px;
    gap:14px;align-items:center;
  }
  .listhead{
    padding:0 12px 7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3);
  }
  .joblist{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);
    border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden}
  .job{
    background:var(--surface);padding:11px 12px;border-left:3px solid var(--sc,var(--line));
    cursor:pointer;transition:background .12s;
  }
  .job:hover{background:var(--surface-2)}
  .jname{font-weight:600;line-height:1.25}
  .jaddr{font-size:12.5px;color:var(--ink-3);margin-top:1px}
  .jmeta{font-size:13px;color:var(--ink-2)}
  .jmono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .pill{
    display:inline-block;padding:3px 9px 3px;border-radius:100px;
    font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.03em;
    text-transform:uppercase;white-space:nowrap;
    background:var(--sbg,var(--surface-2));color:var(--sc,var(--ink-2));
  }
  .dwell{font-size:11px;color:var(--ink-3);margin-top:3px;letter-spacing:.02em}
  .flagchip{
    display:inline-block;margin-top:4px;padding:1px 7px;border-radius:3px;
    font-family:var(--body);font-size:11px;font-weight:600;line-height:1.5;
    background:var(--s-permit-bg);color:var(--s-permit);
  }
  .btn.attn{
    border-color:var(--s-permit);color:var(--s-permit);background:transparent;
    font-family:var(--display);letter-spacing:.03em;text-transform:uppercase;
  }
  .btn.attn:hover{background:var(--s-permit-bg)}
  .btn.attn[aria-pressed="true"]{background:var(--s-permit-bg)}
  .docmeter{display:flex;gap:2.5px;align-items:center}
  .tick{width:9px;height:9px;border-radius:2px;background:var(--line);flex:none}
  .tick.on{background:var(--accent)}
  .chev{color:var(--ink-3);text-align:right;font-family:var(--mono)}
  .empty{
    background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);
    padding:40px 22px;text-align:center;color:var(--ink-3);
  }
  .empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:19px;
    text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}

  /* ---------- drawer / modal ---------- */
  .scrim{
    position:fixed;inset:0;background:rgba(12,18,17,.44);z-index:40;
    display:flex;justify-content:flex-end;
  }
  .drawer{
    width:min(560px,100%);background:var(--paper);height:100%;overflow-y:auto;
    box-shadow:var(--shadow);border-left:1px solid var(--line);
  }
  .dhead{
    position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);
    padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;z-index:2;
  }
  .dhead h2{font-family:var(--display);font-size:23px;font-weight:700;margin:0 0 3px;line-height:1.1}
  .dbody{padding:18px 20px 44px;display:flex;flex-direction:column;gap:22px}
  .card{
    background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:15px 16px 16px;
  }
  .sechead{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);margin:0 0 10px;
  }
  .stagegrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .stagepick{
    cursor:pointer;text-align:left;padding:8px 10px;border-radius:var(--radius);
    border:1px solid var(--line-soft);background:var(--surface);
    font-family:var(--display);font-weight:600;font-size:13.5px;letter-spacing:.03em;
    text-transform:uppercase;color:var(--ink-2);
    border-left:3px solid var(--sc,var(--line));
  }
  .stagepick:hover{background:var(--surface-2)}
  .stagepick[aria-pressed="true"]{background:var(--sbg);color:var(--sc);border-color:var(--sc)}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .fields .wide{grid-column:1/-1}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-3)}
  label.f input,label.f select,label.f textarea{
    padding:7px 9px;background:var(--paper);border:1px solid var(--line);
    border-radius:4px;color:var(--ink);width:100%;
  }
  label.f textarea{resize:vertical;min-height:64px;font-family:inherit}
  .doclist{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);
    border:1px solid var(--line-soft);border-radius:4px;overflow:hidden}
  .docrow{
    background:var(--surface);display:grid;grid-template-columns:22px 1fr auto;
    gap:10px;align-items:center;padding:8px 10px;
  }
  .docrow input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
  .docname{font-size:13.5px}
  .docrow.done .docname{color:var(--ink-3)}
  .linkin{
    width:190px;padding:4px 7px;font-family:var(--mono);font-size:11.5px;
    background:var(--paper);border:1px solid var(--line);border-radius:4px;
  }
  .doclink{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
  .log{display:flex;flex-direction:column;gap:0;margin-top:4px}
  .logitem{
    display:grid;grid-template-columns:96px 1fr;gap:11px;padding:7px 0;
    border-top:1px solid var(--line-soft);font-size:13.5px;
  }
  .logitem:first-child{border-top:none}
  .logtime{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding-top:2px}
  .noteform{display:flex;gap:8px;margin-top:10px}
  .noteform input{flex:1;padding:7px 9px;background:var(--paper);border:1px solid var(--line);border-radius:4px}

  .modal{
    position:fixed;inset:0;background:rgba(12,18,17,.44);z-index:50;
    display:flex;align-items:flex-start;justify-content:center;padding:6vh 18px;
  }
  .sheet{
    width:min(620px,100%);background:var(--paper);border:1px solid var(--line);
    border-radius:8px;box-shadow:var(--shadow);overflow:hidden;max-height:88vh;display:flex;flex-direction:column;
  }
  .sheet .dbody{overflow-y:auto}
  .banner{
    background:var(--s-permit-bg);color:var(--s-permit);border:1px solid currentColor;
    border-radius:var(--radius);padding:10px 13px;font-size:13.5px;margin-bottom:14px;
  }
  footer.foot{
    max-width:1180px;margin:0 auto;padding:0 22px 40px;color:var(--ink-3);font-size:12.5px;
  }
  @media (max-width:820px){
    .listhead{display:none}
    .job{grid-template-columns:1fr auto;gap:6px 12px}
    .job>.jmeta,.job>.jmono,.job>.chev{display:none}
    .job>.jcell-name{grid-column:1}
    .fields{grid-template-columns:1fr}
    .stagegrid{grid-template-columns:1fr}
    .linkin{width:120px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brandline">
      <h1>Grain Innovation Job Board</h1>
      <span class="brandsub">Fence With Style &middot; Lic. CC-26-F-00162-X</span>
    </div>
    <div class="top-right">
      <span class="conn" id="conn"><span class="dot off" id="dot"></span><span id="connText">Connecting</span></span>
      <button class="btn" id="lockBtn">Unlock editing</button>
    </div>
  </div>
  <div class="rail-wrap"><div class="rail" id="rail"></div></div>
</header>

<main>
  <div id="banner"></div>
  <div class="toolbar">
    <input class="search" id="search" type="search" placeholder="Search job, address, permit #, contact&hellip;" aria-label="Search jobs">
    <button class="btn ghost" id="clearFilter" hidden>Clear filter</button>
    <button class="btn attn" id="attnBtn" aria-pressed="false" hidden>Needs attention</button>
    <button class="btn primary" id="newBtn">+ New job</button>
  </div>
  <div class="listhead">
    <span>Job / Address</span><span>Contact</span><span>Fence</span><span>Status</span><span>Key date</span><span></span>
  </div>
  <div class="joblist" id="joblist"></div>
</main>
<footer class="foot" id="foot"></footer>

<div id="layers"></div>

<script>
"use strict";

/* ============================================================
   CONFIG — fill these three in once (see SETUP.md), then the
   board is live for anyone who has the link.
   ============================================================ */
const CFG = {
  url:   "https://eomlonjcttgwwtyfruuk.supabase.co",   // e.g. https://abcdefgh.supabase.co
  key:   "sb_publishable_kh4jo3LZhloPWeBNBd6Mqg_HgaJINOJ",      // the anon / public key
  board: "dd33e1dafe770a2e908944d081fb5360"
};

let unlocked = false;
let editCode = "";
try{ editCode = localStorage.getItem("fws_edit_code") || ""; }catch(_){}

/* ---------------- model ---------------- */
const STAGES = [
  {id:"new",       name:"New Job",       color:"var(--s-new)",      bg:"var(--s-new-bg)",      dateLabel:"Requested"},
  {id:"permit",    name:"Permit Process",color:"var(--s-permit)",   bg:"var(--s-permit-bg)",   dateLabel:"Submitted"},
  {id:"approved",  name:"Permit Approved",color:"var(--s-approved)",bg:"var(--s-approved-bg)", dateLabel:"Approved"},
  {id:"scheduled", name:"Job Scheduled",  color:"var(--s-sched)",   bg:"var(--s-sched-bg)",    dateLabel:"Install date"},
  {id:"progress",  name:"In Progress",    color:"var(--s-active)",  bg:"var(--s-active-bg)",   dateLabel:"Started"},
  {id:"complete",  name:"Complete",       color:"var(--s-done)",    bg:"var(--s-done-bg)",     dateLabel:"Completed"}
];
const stageOf = id => STAGES.find(s => s.id === id) || STAGES[0];

const DOCS = [
  {key:"proposal", name:"Signed proposal"},
  {key:"survey",   name:"Survey / plat"},
  {key:"hoa",      name:"HOA approval"},
  {key:"permitapp",name:"Permit application"},
  {key:"noc",      name:"Notice of commencement"},
  {key:"final",    name:"Final inspection"}
];

const FENCE_TYPES = ["Aluminum","PVC / Vinyl","Chain link","Wood","Iron","Composite","Gate only","Repair"];
const CITIES = ["Fort Lauderdale","Hollywood","Pembroke Pines","Miramar","Davie","Plantation","Sunrise","Coral Springs",
  "Miami","Hialeah","Doral","Homestead","Kendall","Miami Gardens",
  "West Palm Beach","Boca Raton","Delray Beach","Boynton Beach","Wellington"];

let JOBS = [];          // [{id, ...body}]
let db = null;
let filterStage = null;
let query = "";
let openId = null;
let flagOnly = false;

/* ---------------- helpers ---------------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso + (iso.length === 10 ? "T12:00:00" : ""));
  if(isNaN(d)) return esc(iso);
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}
function fmtStamp(ms){
  const d = new Date(ms);
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}) + " " +
         d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
}
function keyDate(j){
  const s = j.stage;
  if(s === "complete") return j.completedDate || j.scheduledDate;
  if(s === "progress" || s === "scheduled") return j.scheduledDate;
  if(s === "approved") return j.permitApprovedDate;
  if(s === "permit") return j.permitSubmittedDate;
  return j.requestedDate;
}
function docCount(j){
  const d = j.docs || {};
  return DOCS.reduce((n,x) => n + (d[x.key] && d[x.key].done ? 1 : 0), 0);
}
const DWELL_LIMIT = {new:7, permit:30, approved:14, progress:14};
function daysInStage(j){
  let t = j.stageSince;
  if(!t){
    const kd = keyDate(j);
    t = kd ? Date.parse(kd + "T12:00:00") : (j.updatedAt || Date.now());
  }
  if(isNaN(t)) t = Date.now();
  return Math.max(0, Math.floor((Date.now() - t) / 86400000));
}
function flagFor(j){
  if(j.stage === "complete") return null;
  const d = daysInStage(j);
  if(j.stage === "scheduled" && j.scheduledDate){
    const past = Math.floor((Date.now() - Date.parse(j.scheduledDate + "T12:00:00")) / 86400000);
    if(past > 0) return {label:"Install date passed",
      detail:`Scheduled ${fmtDate(j.scheduledDate)} and still not marked in progress.`};
    return null;
  }
  const lim = DWELL_LIMIT[j.stage];
  if(lim != null && d > lim) return {label:`${d} days in ${stageOf(j.stage).name}`,
    detail:`This job has sat at ${stageOf(j.stage).name} for ${d} days (flagged past ${lim}).`};
  if(j.stage === "approved" && !(j.docs && j.docs.noc && j.docs.noc.done))
    return {label:"Notice of commencement missing", detail:"Permit is approved but the NOC isn't on file yet."};
  if(j.stage === "scheduled" && !j.scheduledDate)
    return {label:"No install date set", detail:"Job is marked scheduled but has no install date."};
  return null;
}
function blankJob(){
  const docs = {};
  DOCS.forEach(d => docs[d.key] = {done:false,url:""});
  return {
    name:"", address:"", city:"", contact:"", phone:"",
    fenceType:"", linearFeet:"", height:"", price:"",
    stage:"new", permitNumber:"", jurisdiction:"",
    requestedDate:new Date().toISOString().slice(0,10),
    permitSubmittedDate:"", permitApprovedDate:"", scheduledDate:"", completedDate:"",
    crew:"", notes:"", folderUrl:"", docs, log:[],
    stageSince:Date.now(), updatedAt:Date.now()
  };
}

/* ---------------- backend ---------------- */
async function rpc(fn, args){
  const r = await fetch(CFG.url.replace(/\/$/, "") + "/rest/v1/rpc/" + fn, {
    method:"POST",
    headers:{apikey:CFG.key, Authorization:"Bearer " + CFG.key, "Content-Type":"application/json"},
    body:JSON.stringify(args)
  });
  const text = await r.text();
  if(!r.ok){
    const e = new Error(text || ("HTTP " + r.status));
    e.badCode = /bad_code/.test(text);
    e.status = r.status;
    throw e;
  }
  return text ? JSON.parse(text) : null;
}

async function loadJobs(){
  const rows = await rpc("jb_get_jobs", {p_board:CFG.board});
  JOBS = (rows || []).map(r => Object.assign({id:r.id}, r.data));
}

async function saveJob(id, body){
  if(!unlocked){ openGate(); return; }
  body.updatedAt = Date.now();
  const i = JOBS.findIndex(j => j.id === id);
  if(i >= 0) JOBS[i] = Object.assign({id}, body); else JOBS.push(Object.assign({id}, body));
  render();
  try{ await rpc("jb_save_job", {p_board:CFG.board, p_code:editCode, p_id:id, p_data:body}); setConn("live"); }
  catch(e){ handleWriteError(e); }
}

async function removeJob(id){
  if(!unlocked){ openGate(); return; }
  const keep = JOBS.slice();
  JOBS = JOBS.filter(j => j.id !== id);
  openId = null; render();
  try{ await rpc("jb_delete_job", {p_board:CFG.board, p_code:editCode, p_id:id}); setConn("live"); }
  catch(e){ JOBS = keep; render(); handleWriteError(e); }
}

function handleWriteError(e){
  setConn("error");
  if(e.badCode){
    unlocked = false; editCode = "";
    try{ localStorage.removeItem("fws_edit_code"); }catch(_){}
    renderLock();
    flash("That edit code is no longer valid. Enter the current code to keep making changes.");
    openGate();
    return;
  }
  flash("That change didn't save — check your connection. Reload the page to see the saved version of the board.");
  refresh();
}

function logLine(body, text){
  body.log = (body.log || []).concat([{ts:Date.now(), text}]).slice(-40);
}

/* ---------------- rendering ---------------- */
function render(){ renderRail(); renderList(); renderFoot(); renderDrawer(); }

function renderRail(){
  const rail = $("#rail");
  const counts = {};
  STAGES.forEach(s => counts[s.id] = 0);
  JOBS.forEach(j => { if(counts[j.stage] != null) counts[j.stage]++; });
  rail.innerHTML = STAGES.map(s => `
    <button class="stagebtn" data-stage="${s.id}" aria-pressed="${filterStage === s.id}"
            style="--sc:${s.color}" title="Show only ${esc(s.name)}">
      <span class="scount">${counts[s.id]}</span>
      <span class="sname">${esc(s.name)}</span>
    </button>`).join("");
  rail.querySelectorAll(".stagebtn").forEach(b => b.onclick = () => {
    filterStage = filterStage === b.dataset.stage ? null : b.dataset.stage;
    render();
  });
  $("#clearFilter").hidden = !filterStage;
  const flagged = JOBS.filter(flagFor).length;
  const ab = $("#attnBtn");
  ab.hidden = flagged === 0 && !flagOnly;
  ab.textContent = flagged ? `Needs attention · ${flagged}` : "Needs attention · 0";
  ab.setAttribute("aria-pressed", String(flagOnly));
}

function visibleJobs(){
  const q = query.trim().toLowerCase();
  return JOBS
    .filter(j => !filterStage || j.stage === filterStage)
    .filter(j => !flagOnly || flagFor(j))
    .filter(j => !q || [j.name,j.address,j.city,j.contact,j.phone,j.permitNumber,j.fenceType,j.crew]
      .join(" ").toLowerCase().includes(q))
    .sort((a,b) => {
      const oa = STAGES.findIndex(s => s.id === a.stage), ob = STAGES.findIndex(s => s.id === b.stage);
      if(oa !== ob) return oa - ob;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    });
}

function renderList(){
  const list = $("#joblist");
  const rows = visibleJobs();
  if(!rows.length){
    list.innerHTML = `<div class="empty"><strong>${JOBS.length ? "No match" : "No jobs on the board yet"}</strong>
      ${JOBS.length ? "Clear the filter or search to see the rest of the board."
                    : "Add the first Grain Innovation job and everyone with this link will see it."}</div>`;
    return;
  }
  list.innerHTML = rows.map(j => {
    const s = stageOf(j.stage), n = docCount(j), f = flagFor(j);
    return `<div class="job" data-id="${esc(j.id)}" style="--sc:${s.color}" tabindex="0" role="button">
      <div class="jcell-name">
        <div class="jname">${esc(j.name || "Untitled job")}</div>
        <div class="jaddr">${esc([j.address, j.city].filter(Boolean).join(", ") || "No address yet")}</div>
      </div>
      <div class="jmeta">${esc(j.contact || "—")}${j.phone ? `<br><span class="jmono">${esc(j.phone)}</span>` : ""}</div>
      <div class="jmono">${esc(j.fenceType || "—")}${j.linearFeet ? `<br>${esc(j.linearFeet)} LF` : ""}</div>
      <div><span class="pill" style="--sc:${s.color};--sbg:${s.bg}">${esc(s.name)}</span>
        <div class="docmeter" style="margin-top:6px" title="${n} of ${DOCS.length} documents on file">
          ${DOCS.map((d,i) => `<span class="tick ${i < n ? "on" : ""}"></span>`).join("")}
        </div></div>
      <div class="jmono">${fmtDate(keyDate(j))}<br><span style="color:var(--ink-3);font-size:11px">${esc(s.dateLabel)}</span>
        ${f ? `<div class="flagchip" title="${esc(f.detail)}">${esc(f.label)}</div>`
            : (j.stage === "complete" ? "" : `<div class="dwell">${daysInStage(j)}d in stage</div>`)}</div>
      <div class="chev">&rsaquo;</div>
    </div>`;
  }).join("");
  list.querySelectorAll(".job").forEach(el => {
    const open = () => { openId = el.dataset.id; renderDrawer(); };
    el.onclick = open;
    el.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); open(); } };
  });
}

function renderFoot(){
  const done = JOBS.filter(j => j.stage === "complete").length;
  const lf = JOBS.reduce((n,j) => n + (parseFloat(j.linearFeet) || 0), 0);
  const flagged = JOBS.filter(flagFor).length;
  $("#foot").innerHTML = `${JOBS.length} job${JOBS.length === 1 ? "" : "s"} on the board &middot; ${done} complete &middot; `
    + `${flagged} needing attention &middot; `
    + `${lf.toLocaleString()} linear feet tracked${unlocked ? " &middot; your changes save for everyone with this link" : " &middot; view only"}`;
}

function flash(msg){
  $("#banner").innerHTML = `<div class="banner">${esc(msg)}</div>`;
  setTimeout(() => { if($("#banner").textContent.includes(msg)) $("#banner").innerHTML = ""; }, 7000);
}

/* ---------------- drawer ---------------- */
function renderDrawer(){
  const layer = $("#layers");
  const existing = layer.querySelector(".scrim");
  if(!openId){ if(existing) existing.remove(); return; }
  const job = JOBS.find(j => j.id === openId);
  if(!job){ openId = null; if(existing) existing.remove(); return; }
  const s = stageOf(job.stage);
  const scrim = existing || document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `
    <div class="drawer" role="dialog" aria-label="Job detail">
      <div class="dhead">
        <div>
          <h2>${esc(job.name || "Untitled job")}</h2>
          <div class="brandsub">${esc([job.address, job.city].filter(Boolean).join(", ") || "No address")}${
            job.folderUrl ? ` &middot; <a class="doclink" href="${esc(job.folderUrl)}" target="_blank" rel="noopener">job folder</a>` : ""}</div>
        </div>
        <button class="btn ghost" data-act="close" aria-label="Close">Close &times;</button>
      </div>
      <div class="dbody">
        ${(() => { const f = flagFor(job); return f
          ? `<div class="banner"><strong>${esc(f.label)}</strong> &mdash; ${esc(f.detail)}</div>` : ""; })()}
        <div class="card">
          <p class="sechead">Status &mdash; tap to update
            <span style="float:right;text-transform:none;letter-spacing:0">${job.stage === "complete"
              ? "Closed" : daysInStage(job) + " days at this status"}</span></p>
          <div class="stagegrid">
            ${STAGES.map(x => `<button class="stagepick" data-stage="${x.id}" aria-pressed="${x.id === job.stage}"
               style="--sc:${x.color};--sbg:${x.bg}">${esc(x.name)}</button>`).join("")}
          </div>
        </div>

        <div class="card">
          <p class="sechead">Permit &amp; schedule</p>
          <div class="fields">
            <label class="f">Permit number<input data-field="permitNumber" value="${esc(job.permitNumber)}" placeholder="e.g. B-26-14872"></label>
            <label class="f">Jurisdiction<input data-field="jurisdiction" value="${esc(job.jurisdiction)}" placeholder="City / county" list="cityList"></label>
            <label class="f">Permit submitted<input type="date" data-field="permitSubmittedDate" value="${esc(job.permitSubmittedDate)}"></label>
            <label class="f">Permit approved<input type="date" data-field="permitApprovedDate" value="${esc(job.permitApprovedDate)}"></label>
            <label class="f">Install date<input type="date" data-field="scheduledDate" value="${esc(job.scheduledDate)}"></label>
            <label class="f">Completed<input type="date" data-field="completedDate" value="${esc(job.completedDate)}"></label>
            <label class="f wide">Crew / installer<input data-field="crew" value="${esc(job.crew)}" placeholder="Who's running it"></label>
            <label class="f wide">Job folder link
              <input data-field="folderUrl" value="${esc(job.folderUrl || "")}" placeholder="Drive / Dropbox folder for this job">
            </label>
          </div>
        </div>

        <div class="card">
          <p class="sechead">Documents</p>
          <div class="doclist">
            ${DOCS.map(d => {
              const rec = (job.docs && job.docs[d.key]) || {done:false,url:""};
              return `<div class="docrow ${rec.done ? "done" : ""}">
                <input type="checkbox" data-doc="${d.key}" ${rec.done ? "checked" : ""} aria-label="${esc(d.name)} on file">
                <span class="docname">${esc(d.name)}${rec.url ? ` &middot; <a class="doclink" href="${esc(rec.url)}" target="_blank" rel="noopener">open</a>` : ""}</span>
                <input class="linkin" data-doclink="${d.key}" value="${esc(rec.url)}" placeholder="paste link">
              </div>`;
            }).join("")}
          </div>
          <p style="margin:9px 0 0;font-size:12.5px;color:var(--ink-3)">
            Paste a Drive, Dropbox or portal link for each document so the whole team opens the same copy.</p>
        </div>

        <div class="card">
          <p class="sechead">Scope &amp; contact</p>
          <div class="fields">
            <label class="f wide">Job name<input data-field="name" value="${esc(job.name)}"></label>
            <label class="f wide">Address<input data-field="address" value="${esc(job.address)}"></label>
            <label class="f">City<input data-field="city" value="${esc(job.city)}" list="cityList"></label>
            <label class="f">Fence type<input data-field="fenceType" value="${esc(job.fenceType)}" list="fenceList"></label>
            <label class="f">Linear feet<input data-field="linearFeet" value="${esc(job.linearFeet)}" inputmode="decimal"></label>
            <label class="f">Height<input data-field="height" value="${esc(job.height)}" placeholder="6 ft"></label>
            <label class="f">Site contact<input data-field="contact" value="${esc(job.contact)}"></label>
            <label class="f">Phone<input data-field="phone" value="${esc(job.phone)}"></label>
            <label class="f wide">Contract amount<input data-field="price" value="${esc(job.price)}" placeholder="$"></label>
            <label class="f wide">Notes<textarea data-field="notes" placeholder="Gate swing, HOA color, dig alert, access…">${esc(job.notes)}</textarea></label>
          </div>
        </div>

        <div class="card">
          <p class="sechead">Activity</p>
          <div class="noteform">
            <input id="noteInput" placeholder="Add an update everyone will see&hellip;" aria-label="Add an update">
            <button class="btn" data-act="addnote">Post</button>
          </div>
          <div class="log">
            ${(job.log || []).slice().reverse().map(l =>
              `<div class="logitem"><span class="logtime">${fmtStamp(l.ts)}</span><span>${esc(l.text)}</span></div>`).join("")
              || `<div class="logitem"><span class="logtime">&mdash;</span><span style="color:var(--ink-3)">No activity logged yet.</span></div>`}
          </div>
        </div>

        <div><button class="btn danger" data-act="delete">Remove this job from the board</button></div>
      </div>
    </div>`;
  if(!existing) layer.appendChild(scrim);

  scrim.onclick = e => { if(e.target === scrim){ openId = null; renderDrawer(); } };
  const body = () => { const {id, ...rest} = JOBS.find(j => j.id === openId); return JSON.parse(JSON.stringify(rest)); };

  scrim.querySelector('[data-act="close"]').onclick = () => { openId = null; renderDrawer(); };
  scrim.querySelector('[data-act="delete"]').onclick = () => {
    const b = JOBS.find(j => j.id === openId);
    if(confirmish(`Remove "${b.name || "this job"}" from the board?`)) removeJob(openId);
  };
  scrim.querySelectorAll(".stagepick").forEach(btn => btn.onclick = () => {
    const b = body(); if(b.stage === btn.dataset.stage) return;
    const from = stageOf(b.stage).name, to = stageOf(btn.dataset.stage).name;
    b.stage = btn.dataset.stage;
    const today = new Date().toISOString().slice(0,10);
    if(b.stage === "permit"    && !b.permitSubmittedDate) b.permitSubmittedDate = today;
    if(b.stage === "approved"  && !b.permitApprovedDate)  b.permitApprovedDate  = today;
    if(b.stage === "complete"  && !b.completedDate)       b.completedDate       = today;
    b.stageSince = Date.now();
    logLine(b, `Status: ${from} → ${to}`);
    saveJob(openId, b);
  });
  scrim.querySelectorAll("[data-field]").forEach(inp => inp.onchange = () => {
    const b = body(), f = inp.dataset.field;
    if(b[f] === inp.value) return;
    b[f] = inp.value;
    logLine(b, `Updated ${labelFor(f)}${inp.value ? `: ${inp.value}` : " (cleared)"}`);
    saveJob(openId, b);
  });
  scrim.querySelectorAll("[data-doc]").forEach(cb => cb.onchange = () => {
    const b = body(), k = cb.dataset.doc;
    b.docs = b.docs || {}; b.docs[k] = b.docs[k] || {done:false,url:""};
    b.docs[k].done = cb.checked;
    logLine(b, `${DOCS.find(d => d.key === k).name} ${cb.checked ? "marked on file" : "unmarked"}`);
    saveJob(openId, b);
  });
  scrim.querySelectorAll("[data-doclink]").forEach(inp => inp.onchange = () => {
    const b = body(), k = inp.dataset.doclink;
    b.docs = b.docs || {}; b.docs[k] = b.docs[k] || {done:false,url:""};
    b.docs[k].url = inp.value.trim();
    logLine(b, `${DOCS.find(d => d.key === k).name} link ${inp.value.trim() ? "added" : "removed"}`);
    saveJob(openId, b);
  });
  const post = () => {
    const el = scrim.querySelector("#noteInput"), t = el.value.trim();
    if(!t) return;
    const b = body(); logLine(b, t); el.value = "";
    saveJob(openId, b);
  };
  scrim.querySelector('[data-act="addnote"]').onclick = post;
  scrim.querySelector("#noteInput").onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); post(); } };
}

function labelFor(f){
  return ({permitNumber:"permit number", jurisdiction:"jurisdiction", permitSubmittedDate:"permit submitted date",
    permitApprovedDate:"permit approval date", scheduledDate:"install date", completedDate:"completion date",
    crew:"crew", name:"job name", address:"address", city:"city", fenceType:"fence type",
    linearFeet:"linear feet", height:"height", contact:"site contact", phone:"phone",
    price:"contract amount", notes:"notes", folderUrl:"job folder link"})[f] || f;
}
function confirmish(msg){ return window.confirm(msg); }

/* ---------------- new job ---------------- */
function openNew(){
  const layer = $("#layers");
  const wrap = document.createElement("div");
  wrap.className = "modal";
  wrap.innerHTML = `
    <div class="sheet" role="dialog" aria-label="New job">
      <div class="dhead">
        <div><h2>New job</h2><div class="brandsub">Grain Innovation Construction</div></div>
        <button class="btn ghost" data-act="cancel" aria-label="Cancel">Cancel &times;</button>
      </div>
      <div class="dbody">
        <div class="card">
          <div class="fields">
            <label class="f wide">Job name <input id="n_name" placeholder="e.g. Riverbend Townhomes — Phase 2" autofocus></label>
            <label class="f wide">Address <input id="n_address" placeholder="Street address"></label>
            <label class="f">City <input id="n_city" list="cityList"></label>
            <label class="f">Jurisdiction <input id="n_juris" list="cityList" placeholder="Permitting city / county"></label>
            <label class="f">Fence type <input id="n_type" list="fenceList"></label>
            <label class="f">Linear feet <input id="n_lf" inputmode="decimal"></label>
            <label class="f">Site contact <input id="n_contact"></label>
            <label class="f">Phone <input id="n_phone"></label>
            <label class="f">Contract amount <input id="n_price" placeholder="$"></label>
            <label class="f wide">Job folder link <input id="n_folder" placeholder="Drive / Dropbox folder for this job"></label>
            <label class="f">Starting status
              <select id="n_stage">${STAGES.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select>
            </label>
            <label class="f wide">Notes <textarea id="n_notes" placeholder="Scope, access, HOA color, gate details…"></textarea></label>
          </div>
        </div>
        <div style="display:flex;gap:9px;justify-content:flex-end">
          <button class="btn ghost" data-act="cancel">Cancel</button>
          <button class="btn primary" data-act="create">Add to board</button>
        </div>
      </div>
    </div>`;
  layer.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.onclick = e => { if(e.target === wrap) close(); };
  wrap.querySelectorAll('[data-act="cancel"]').forEach(b => b.onclick = close);
  wrap.querySelector('[data-act="create"]').onclick = () => {
    const g = id => (wrap.querySelector("#" + id).value || "").trim();
    const b = blankJob();
    b.name = g("n_name") || "Untitled job";
    b.address = g("n_address"); b.city = g("n_city"); b.jurisdiction = g("n_juris");
    b.fenceType = g("n_type"); b.linearFeet = g("n_lf");
    b.contact = g("n_contact"); b.phone = g("n_phone"); b.price = g("n_price");
    b.notes = g("n_notes"); b.folderUrl = g("n_folder");
    b.stage = wrap.querySelector("#n_stage").value;
    b.stageSince = Date.now();
    logLine(b, `Job added to the board at status: ${stageOf(b.stage).name}`);
    const id = uid();
    close();
    saveJob(id, b).then(() => { openId = id; renderDrawer(); });
  };
  wrap.querySelector("#n_name").focus();
}

/* ---------------- wiring ---------------- */
$("#newBtn").onclick = openNew;
$("#clearFilter").onclick = () => { filterStage = null; flagOnly = false; render(); };
$("#attnBtn").onclick = () => { flagOnly = !flagOnly; render(); };
$("#search").oninput = e => { query = e.target.value; renderList(); };
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    const m = document.querySelector(".modal");
    if(m) m.remove();
    else if(openId){ openId = null; renderDrawer(); }
  }
});
const dl = document.createElement("div");
dl.innerHTML = `<datalist id="cityList">${CITIES.map(c => `<option value="${c}"></option>`).join("")}</datalist>
  <datalist id="fenceList">${FENCE_TYPES.map(c => `<option value="${c}"></option>`).join("")}</datalist>`;
document.body.appendChild(dl);

/* ---------------- access gate ---------------- */
function setConn(state){
  const dot = $("#dot"), t = $("#connText");
  if(state === "live"){ dot.classList.remove("off"); t.textContent = unlocked ? "Live · editing on" : "Live · view only"; }
  else if(state === "loading"){ dot.classList.add("off"); t.textContent = "Loading"; }
  else { dot.classList.add("off"); t.textContent = "Offline"; }
}
function renderLock(){
  const b = $("#lockBtn");
  b.textContent = unlocked ? "Editing on · lock" : "Unlock editing";
  b.classList.toggle("primary", !unlocked);
  $("#newBtn").hidden = !unlocked;
  setConn("live");
}
function openGate(){
  const layer = $("#layers");
  if(layer.querySelector(".gate")) return;
  const wrap = document.createElement("div");
  wrap.className = "modal gate";
  wrap.innerHTML = `
    <div class="sheet" role="dialog" aria-label="Unlock editing">
      <div class="dhead">
        <div><h2>Unlock editing</h2><div class="brandsub">Fence With Style &middot; job board</div></div>
        <button class="btn ghost" data-act="cancel" aria-label="Cancel">Cancel &times;</button>
      </div>
      <div class="dbody">
        <div class="card">
          <p style="margin:0 0 12px;color:var(--ink-2)">
            Anyone with this link can read the board. Enter the edit code to change statuses, dates and documents.
            This device will remember it.</p>
          <label class="f">Edit code
            <input id="gateCode" autocomplete="off" spellcheck="false" placeholder="e.g. FWS-BOARD-0000">
          </label>
          <div id="gateMsg" style="margin-top:9px;font-size:13px;color:var(--s-permit)"></div>
        </div>
        <div style="display:flex;gap:9px;justify-content:flex-end">
          <button class="btn ghost" data-act="cancel">Cancel</button>
          <button class="btn primary" data-act="unlock">Unlock</button>
        </div>
      </div>
    </div>`;
  layer.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.onclick = e => { if(e.target === wrap) close(); };
  wrap.querySelectorAll('[data-act="cancel"]').forEach(b => b.onclick = close);
  const submit = async () => {
    const code = wrap.querySelector("#gateCode").value.trim();
    if(!code) return;
    wrap.querySelector("#gateMsg").textContent = "Checking\u2026";
    try{
      const ok = await rpc("jb_check_code", {p_board:CFG.board, p_code:code});
      if(ok){
        unlocked = true; editCode = code;
        try{ localStorage.setItem("fws_edit_code", code); }catch(_){}
        close(); renderLock(); render();
      }else{
        wrap.querySelector("#gateMsg").textContent = "That code doesn't match this board.";
      }
    }catch(e){
      wrap.querySelector("#gateMsg").textContent = "Couldn't reach the board. Check your connection and try again.";
    }
  };
  wrap.querySelector('[data-act="unlock"]').onclick = submit;
  const inp = wrap.querySelector("#gateCode");
  inp.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); submit(); } };
  inp.focus();
}
$("#lockBtn").onclick = () => {
  if(unlocked){
    unlocked = false; editCode = "";
    try{ localStorage.removeItem("fws_edit_code"); }catch(_){}
    openId = null; renderLock(); render();
  }else openGate();
};

/* ---------------- boot + refresh ---------------- */
async function refresh(){
  try{ await loadJobs(); setConn("live"); render(); }
  catch(e){
    setConn("error");
    if(/PASTE_/.test(CFG.url) || /PASTE_/.test(CFG.key))
      flash("This board isn't connected yet — the Supabase URL and key still need to be filled in (see SETUP.md).");
    else flash("Couldn't load the board. Check your connection; it will retry shortly.");
  }
}

(async () => {
  setConn("loading");
  render();
  if(editCode){
    try{ unlocked = !!(await rpc("jb_check_code", {p_board:CFG.board, p_code:editCode})); }
    catch(_){ unlocked = false; }
    if(!unlocked){ editCode = ""; try{ localStorage.removeItem("fws_edit_code"); }catch(_){} }
  }
  renderLock();
  await refresh();
  setInterval(() => { if(!document.querySelector(".scrim") && !document.querySelector(".modal")) refresh(); }, 20000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(); });
})();
</script>
